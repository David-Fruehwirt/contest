name: ensemble
on:
  push:
    branches: [main]
    paths: ['team/**']
  pull_request:
    paths: ['team/**']
permissions:
  contents: write
jobs:
  ensemble:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: team
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate submissions (PR)
        if: github.event_name == 'pull_request'
        run: python3 ensemble.py --check && cat LEADERBOARD.md >> "$GITHUB_STEP_SUMMARY"
      - name: Build best-of-team (main)
        if: github.event_name == 'push'
        run: |
          chmod u+w best/* 2>/dev/null || true
          python3 ensemble.py
          cat LEADERBOARD.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name "ensemble-bot"; git config user.email "ensemble-bot@users.noreply.github.com"
          git add best LEADERBOARD.md ensemble
          git diff --cached --quiet || git commit -m "ensemble: $(grep -o 'Ensemble total: [0-9]*' LEADERBOARD.md)" && git push
